name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: restaurant_test
          POSTGRES_USER: restaurant_admin
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restaurant_admin -d restaurant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RESTAURANT_ENVIRONMENT: test
      RESTAURANT_DEBUG: "false"
      TEST_DATABASE_URL: "postgres://restaurant_admin:ci-only-password@127.0.0.1:5432/restaurant_test?sslmode=disable"
      DBMATE_MIGRATIONS_DIR: "./migrations"
      DBMATE_NO_DUMP_SCHEMA: "true"
      DBMATE_STRICT: "true"

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Install dbmate
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/amacneil/dbmate/releases/download/v2.37.0/dbmate-linux-amd64 \
            --output "$RUNNER_TEMP/dbmate"
          echo "f855e99a0f0a81322014bf686b1cb820d2b4d8074e4eadafd64b851b80ecb15a  $RUNNER_TEMP/dbmate" | sha256sum --check
          chmod +x "$RUNNER_TEMP/dbmate"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Unit tests
        run: uv run --locked python -m pytest -q -m "not integration"

      - name: Apply migrations and verify repeatability
        run: |
          dbmate --env TEST_DATABASE_URL migrate
          dbmate --env TEST_DATABASE_URL migrate
          dbmate --env TEST_DATABASE_URL status --exit-code

      - name: Database integration tests
        run: uv run --locked python -m pytest -q -m integration