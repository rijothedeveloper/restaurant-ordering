on_http_request:
  - expressions:
      - >-
          !((req.method == 'POST' &&
          (req.url.path == '/telnyx/voice' || req.url.path == '/telnyx/status')) ||
          (req.method == 'GET' && req.url.path == '/telnyx/relay'))
    actions:
      - type: custom-response
        config:
          status_code: 404
          body: "Not found"